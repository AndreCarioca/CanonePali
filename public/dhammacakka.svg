<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F1535"/>
      <stop offset="100%" stop-color="#0B0910"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.4" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>

  <!-- Main Dharmachakra (8-spoked Wheel) -->
  <g filter="url(#glow)">
    <!-- Outer Rim -->
    <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <circle cx="256" cy="256" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- 8 Spokes representing the Noble Eightfold Path -->
    <!-- 0 deg -->
    <line x1="256" y1="148" x2="256" y2="70" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- 45 deg -->
    <line x1="332" y1="180" x2="388" y2="124" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- 90 deg -->
    <line x1="364" y1="256" x2="442" y2="256" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- 135 deg -->
    <line x1="332" y1="332" x2="388" y2="388" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- 180 deg -->
    <line x1="256" y1="364" x2="256" y2="442" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- 225 deg -->
    <line x1="180" y1="332" x2="124" y2="388" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- 270 deg -->
    <line x1="148" y1="256" x2="70" y2="256" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- 315 deg -->
    <line x1="180" y1="180" x2="124" y2="124" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Inner Spokes (from hub to inner rim) -->
    <line x1="256" y1="256" x2="256" y2="148" stroke="url(#goldGrad)" stroke-width="7"/>
    <line x1="256" y1="256" x2="332" y2="180" stroke="url(#goldGrad)" stroke-width="7"/>
    <line x1="256" y1="256" x2="364" y2="256" stroke="url(#goldGrad)" stroke-width="7"/>
    <line x1="256" y1="256" x2="332" y2="332" stroke="url(#goldGrad)" stroke-width="7"/>
    <line x1="256" y1="256" x2="256" y2="364" stroke="url(#goldGrad)" stroke-width="7"/>
    <line x1="256" y1="256" x2="180" y2="332" stroke="url(#goldGrad)" stroke-width="7"/>
    <line x1="256" y1="256" x2="148" y2="256" stroke="url(#goldGrad)" stroke-width="7"/>
    <line x1="256" y1="256" x2="180" y2="180" stroke="url(#goldGrad)" stroke-width="7"/>

    <!-- Center Hub -->
    <circle cx="256" cy="256" r="46" fill="#130D24" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="256" cy="256" r="24" fill="url(#goldGrad)"/>
    <circle cx="256" cy="256" r="10" fill="#0B0910"/>
  </g>
</svg>
